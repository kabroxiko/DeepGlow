---
name: Semantic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run semantic-release action
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 24
          extra_plugins: |
            conventional-changelog-conventionalcommits
            @semantic-release/commit-analyzer
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: DeepGlow Release Bot
          GIT_AUTHOR_EMAIL: deepglow-release-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: DeepGlow Release Bot
          GIT_COMMITTER_EMAIL: deepglow-release-bot@users.noreply.github.com
